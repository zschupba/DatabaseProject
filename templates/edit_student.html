<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
</head>
<body>

<h2>Edit Student</h2>

<form method="POST">
    <label>First Name:</label>
    <input type="text" name="first_name" value="{{ student.first_name }}"><br><br>

    <label>Last Name:</label>
    <input type="text" name="last_name" value="{{ student.last_name }}"><br><br>

    <label>Email:</label>
    <input type="text" name="email" value="{{ student.email }}"><br><br>

    <button type="submit">Update</button>
</form>

<br>
<a href="/view-students">Back</a>

</body>
</html>
