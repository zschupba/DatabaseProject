<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KSU Student Portal — Login</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f5f5f5; display: flex; flex-direction: column; min-height: 100vh; }
        header { background: #333; color: white; padding: 1rem 2rem; }
        header strong { font-size: 1.1rem; }
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; }
        .login-box { background: white; border: 1px solid #ccc; border-radius: 4px; padding: 2rem; width: 100%; max-width: 380px; }
        .login-box h2 { margin-top: 0; margin-bottom: 0.3rem; }
        .login-box p { color: #666; margin-bottom: 1.5rem; font-size: 0.9rem; }
        label { display: block; font-weight: bold; margin-bottom: 0.2rem; }
        input { width: 100%; box-sizing: border-box; padding: 0.6rem; border: 1px solid #ccc; border-radius: 3px; margin-bottom: 1rem; font-size: 1rem; }
        button { width: 100%; padding: 0.7rem; background: #0066cc; color: white; border: none; border-radius: 3px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #0052a3; }
        .alert { padding: 0.8rem; margin-bottom: 1rem; border-radius: 3px; font-size: 0.9rem; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
<header><strong>KSU Student Portal</strong></header>
<main>
    <div class="login-box">
        <h2>Sign In</h2>
        <p>Enter your username and password to continue.</p>
        <div id="alert" class="alert alert-error" style="display:none;"></div>
        <label>Username</label>
        <input type="text" id="username" placeholder="Enter username" autocomplete="username">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
        <button onclick="doLogin()">Login</button>
    </div>
</main>
<script>
    document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    async function doLogin() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const alert = document.getElementById('alert');
        alert.style.display = 'none';

        if (!username || !password) {
            alert.textContent = 'Please enter both username and password.';
            alert.style.display = 'block';
            return;
        }

        try {
            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.error) {
                alert.textContent = data.error;
                alert.style.display = 'block';
            } else {
                window.location.href = data.redirect;
            }
        } catch (err) {
            alert.textContent = 'Network error. Please try again.';
            alert.style.display = 'block';
        }
    }
</script>
</body>
</html>
