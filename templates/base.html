<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}KSU Portal{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f5f5f5; }
        nav { background: #333; color: white; padding: 1rem; display: flex; align-items: center; gap: 1rem; }
        nav strong { margin-right: 1rem; }
        nav a { color: white; text-decoration: none; margin: 0 0.5rem; }
        nav a.active { color: yellow; }
        nav .nav-right { margin-left: auto; display: flex; align-items: center; gap: 1rem; }
        nav .nav-right span { color: #ccc; font-size: 0.9rem; }
        nav .nav-right a { color: #ff8080; }
        main { max-width: 1100px; margin: 0 auto; padding: 2rem; }
        .card { background: white; border: 1px solid #ccc; padding: 1.5rem; margin: 1rem 0; border-radius: 4px; }
        label { display: block; margin: 0.5rem 0 0.2rem 0; font-weight: bold; }
        input, select { padding: 0.5rem; width: 100%; box-sizing: border-box; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 3px; }
        button { padding: 0.5rem 1rem; margin: 0.3rem 0.3rem 0.3rem 0; background: #0066cc; color: white; border: none; cursor: pointer; border-radius: 3px; }
        button:hover { opacity: 0.85; }
        table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
        th, td { padding: 0.6rem 0.5rem; text-align: left; border: 1px solid #ccc; }
        th { background: #f0f0f0; font-weight: bold; }
        tr:hover { background: #f9f9f9; }
        .alert { padding: 0.8rem 1rem; margin: 0.8rem 0; border-radius: 3px; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        hr { border: none; border-top: 1px solid #ddd; margin: 1.2rem 0; }
        small { color: #666; display: block; margin-top: -0.8rem; margin-bottom: 0.5rem; }
        .btn-danger { background: #cc0000; }
        .btn-success { background: #37d15b; }
        .btn-secondary { background: #666; }
        .btn-warning { background: #e08800; }
        .tabs { display: flex; gap: 0; margin-bottom: 0; border-bottom: 2px solid #0066cc; }
        .tab { padding: 0.6rem 1.2rem; cursor: pointer; background: #eee; border: 1px solid #ccc; border-bottom: none; margin-right: 4px; border-radius: 3px 3px 0 0; }
        .tab.active { background: white; border-bottom: 2px solid white; margin-bottom: -2px; font-weight: bold; color: #0066cc; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .modal-backdrop { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 1000; }
        .modal-backdrop.open { display: flex; }
        .modal { background: white; border-radius: 4px; padding: 1.5rem; width: 90%; max-width: 560px; max-height: 85vh; overflow-y: auto; position: relative; }
        .modal h3 { margin-top: 0; }
        .modal-close { position: absolute; top: 1rem; right: 1rem; background: #999; border: none; color: white; padding: 0.3rem 0.7rem; cursor: pointer; border-radius: 3px; }
        .badge { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 3px; font-size: 0.8rem; font-weight: bold; }
        .badge-admin { background: #333; color: white; }
        .badge-instructor { background: #0066cc; color: white; }
        .badge-student { background: #37d15b; color: white; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        @media(max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<nav>
    <strong>KSU Student Portal</strong>
    {% block nav_links %}{% endblock %}
    <div class="nav-right">
        <span>{{ username }} &nbsp;<span class="badge badge-{{ session.role }}">{{ session.role }}</span></span>
        <a href="/logout">Logout</a>
    </div>
</nav>

<main>
    {% block content %}{% endblock %}
</main>

{% block extra_scripts %}{% endblock %}
</body>
</html>
